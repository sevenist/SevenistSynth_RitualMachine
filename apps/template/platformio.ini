; PlatformIO project for this app's firmware on the first prototype (HWV1: ESP32-S3). Build it from this folder (`pio run`) or from
; the repo root (`pio run -d apps/template`); flash with `-t upload`. On this machine use C:\.platformio\penv\Scripts\pio.exe, never a
; bare `pio` (DEVELOPING.md, the warning under "ESP32 firmware and performance work").
[platformio]
default_envs = hwv1
; The source folder is the repo root, and build_src_filter below picks the library's engine and this app out of it: both are then
; "project sources" to PlatformIO and get the same compiler flags (build_src_flags). As a PlatformIO library the engine would be
; compiled with the framework's -Os, which the audio code cannot afford (ENGINE_DESIGN.md ADR-035).
src_dir = ../..
libdeps_dir = ../../.pio/libdeps         ; one download of the libraries for every app of the repo

[app]
dir = apps/template                      ; this folder, from the repo root (tools/new_project.ps1 sets it)

[env:hwv1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino

; The prototype's module is a Waveshare ESP32-S3-Pico (16 MB flash, 2 MB quad PSRAM): the generic S3 board with what differs.
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200

build_src_filter =
    +<framework/engine/>
    +<${app.dir}/src/>

build_flags =
    -I src                       ; this app's headers
    -I ../../framework           ; the library: "engine/..."
    -DHWV1                       ; hardware revision: selects the pin block in src/board_pins.h
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1         ; USB-Serial/JTAG as the serial console
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0     ; loop() on core 0: core 1 belongs to the audio task
    -DENGINE_SR=44100            ; the engine's sample rate (default 48000; see framework/engine/dsp/config.h for every ENGINE_ flag)
    -DENGINE_CMD_RING=32         ; command ring entries (270 bytes each, static internal RAM): raise it if note_on ever returns false
    -std=gnu++17                 ; the engine is C++17 (no exceptions, no RTTI, no heap after init)
    -fno-exceptions
    -fno-rtti
    -O2

; The Arduino framework appends -Os AFTER the -O2 of build_flags; build_src_flags come last and apply to the project sources
; (the engine and this app). Without them the audio code is compiled for size and hardly anything is inlined.
build_src_flags =
    -O2
    -fno-stack-protector

build_unflags =
    -std=gnu++11
    -std=gnu++2a

lib_deps =
    adafruit/Adafruit TCA8418@^1.0.2     ; the key matrix controller (HWV1)
