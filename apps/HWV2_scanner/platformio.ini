; The key matrix and encoder scanner of the second prototype (HWV2, KiCad project GRV-mini): the firmware of U14, a CH32V006, flashed through a
; WCH-LinkE on SWIO (the LinkE in RV mode, not DAP). Flash it from VS Code (pick HWV2_scanner in the PlatformIO status bar) or from the repo
; root: .\upload.ps1 -App HWV2_scanner. The synth's HWV2 build reads it (framework/boards/hwv2/input_esp32.cpp).
[platformio]
default_envs = HWV2_scanner

[env:HWV2_scanner]
platform = ch32v
framework = noneos-sdk
board = genericCH32V006E8R6
upload_protocol = wlink
