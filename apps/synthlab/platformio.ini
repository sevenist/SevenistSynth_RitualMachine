; PlatformIO project for SynthLab's firmware on the prototypes: HWV2 (KiCad project GRV-mini: ESP32-S3, 128 x 160 colour screen) and HWV1.
; Build it from VS Code (open oled_sim.code-workspace, pick the folder "synthlab" in the PlatformIO status bar), or from the repo root
; with C:\.platformio\penv\Scripts\pio.exe run -d apps/synthlab, never a bare `pio` (framework/docs/BOARDS.md, the warning under "ESP32 firmware
; and performance work"); flash with -t upload. Two environments: hwv2 (the default) and hwv1, the first prototype (the app finds its
; controls in any board's table).
[platformio]
default_envs = hwv2
; The source folder is the repo root, and build_src_filter below picks the library's parts and this app out of it: both are then
; "project sources" to PlatformIO and get the same compiler flags (build_src_flags). As a PlatformIO library the engine would be
; compiled with the framework's -Os, which the audio code cannot afford (framework/docs/DESIGN.md ADR-035).
src_dir = ../..
libdeps_dir = ../../.pio/libdeps         ; one download of the libraries for every app of the repo

[app]
dir = apps/synthlab                      ; this folder, from the repo root

[env:hwv2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino

; The module is a Waveshare ESP32-S3-Pico (16 MB flash, 2 MB quad PSRAM): the generic S3 board with what differs.
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200

build_src_filter =
    +<framework/engine/>
    +<framework/ui/>             ; the drawing kit and its colour canvas
    +<framework/boards/esp32/>   ; what the ESP32 boards share: the display task, the LEDs, I2S, the mux, the input queue, the power
    +<framework/boards/hwv2/>    ; the second prototype: its screen, controls, LEDs, card, power switch
    +<framework/app/>            ; the entry point: setup and loop (app/app_main.h)
    +<${app.dir}/src/>
    +<framework/modular/catalog.cpp>          ; an engine synth's modules (engine_modules.h; dropped by the linker when none uses them)
    +<framework/modular/engine_modules.cpp>

build_flags =
    -I src                       ; this app's headers
    -I ../../framework           ; the library: "engine/...", "hal/...", "ui/...", "boards/..."
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src/clib"   ; the C header "u8g2.h"
    -DHWV2                       ; hardware revision: the board of framework/boards/hwv2 (its pin block: boards/esp32/board_pins.h)
    -DDISPLAY_HEIGHT=160         ; its screen is 128 x 160
    -DDEV_OUTPUT_GAIN_PCT=25     ; output level in percent of full scale: protects headphones (100 or remove = full)
    -DFASTLED_RMT_MAX_CHANNELS=1 ; the LEDs use one RMT channel
    -DHW_LED_MAX_BRIGHTNESS=80   ; LED brightness cap 0..255
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1         ; USB-Serial/JTAG as the serial console
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0     ; loop() on core 0: core 1 belongs to the audio task
    -DENGINE_CMD_RING=64         ; command ring entries (270 bytes each, from the engine's bulk heap): a change of synth sends 17 at once
    -std=gnu++17                 ; the engine is C++17 (no exceptions, no RTTI, no heap after init)
    -fno-exceptions
    -fno-rtti
    -O2
    -DENGINE_SR=44100            ; 44.1 kHz on both prototypes (one MCU, one budget: 174149 cycles of the audio core per 32-frame block,
                                 ;   every voice together; the cost table framework/modular/module_costs.h is measured at this rate)

; The Arduino framework appends -Os AFTER the -O2 of build_flags; build_src_flags come last and apply to the project sources
; (the engine and this app). Without them the audio code is compiled for size and hardly anything is inlined.
; -mtext-section-literals: each function's constants next to its code, so that code defined in a header can sit in internal RAM
; (SC_HOT: the synths' render, lab.h; the modular modules, framework/modular/modules.h). Without it the link fails ("dangerous
; relocation: l32r: literal placed after use"). From flash, through the cache the screen's code shares, a synth cost up to 2.5 times its
; own cycles (measured on HWV1, 2026-11-15, the bench below); in internal RAM the Kick takes half the CPU it did.
build_src_flags =
    -O2
    -fno-stack-protector
    -mtext-section-literals

build_unflags =
    -std=gnu++11
    -std=gnu++2a

lib_deps =
    olikraus/U8g2                        ; the drawing (u8g2 draws into the colour frame: ui/canvas.h)
    fastled/FastLED@3.10.6               ; the LEDs (pinned: see apps/ritual_machine/platformio.ini)

; The first prototype (HWV1: 128 x 128 screen, 32 note keys and 4 function keys, seven endless pots, a joystick): HWV2's environment
; with HWV1's board (framework/boards/hwv1: its screen, key controller, LEDs, card, power, audio output) and the engine at 44.1 kHz,
; as the Ritual Machine's release and apps/template run it there. The controls: src/app.cpp (pots 0 / 1 as encoders A / B, the
; joystick for the pushes and PLAY).
[env:hwv1]
extends = env:hwv2
build_src_filter =
    +<framework/engine/>
    +<framework/ui/>             ; the drawing kit
    +<framework/boards/esp32/>   ; what the ESP32 boards share: the card task, the mux
    +<framework/boards/hwv1/>    ; the first prototype: display, controls, LEDs, card, power, audio output
    +<framework/app/>            ; the entry point: setup and loop (app/app_main.h)
    +<${app.dir}/src/>
    +<framework/modular/catalog.cpp>          ; an engine synth's modules (engine_modules.h; dropped by the linker when none uses them)
    +<framework/modular/engine_modules.cpp>

build_flags =
    -I src                       ; this app's headers
    -I ../../framework           ; the library: "engine/...", "hal/...", "ui/...", "boards/..."
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src/clib"   ; the C header "u8g2.h"
    -DHWV1                       ; hardware revision: the board of framework/boards/hwv1 (its pin block: boards/esp32/board_pins.h)
    -DDEV_OUTPUT_GAIN_PCT=25     ; output level in percent of full scale: the prototype is loud on headphones (100 or remove = full)
    -DFASTLED_RMT_MAX_CHANNELS=1 ; the key LEDs use one RMT channel
    -DHW_LED_MAX_BRIGHTNESS=80   ; key LED brightness cap 0..255: full white on 36 LEDs browns out the board / USB
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1         ; USB-Serial/JTAG as the serial console
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0     ; loop() on core 0: core 1 belongs to the audio task
    -DENGINE_SR=44100            ; 44.1 kHz, as on HWV2 (one MCU, one budget)
    -DENGINE_CMD_RING=64         ; command ring entries (270 bytes each, from the engine's bulk heap): a change of synth sends 17 at once
    -std=gnu++17                 ; the engine is C++17 (no exceptions, no RTTI, no heap after init)
    -fno-exceptions
    -fno-rtti
    -O2

lib_deps =
    ${env:hwv2.lib_deps}
    adafruit/Adafruit TCA8418@^1.0.2     ; the key matrix controller (HWV1)

; Dev only: the modules' benchmark (src/bench_esp32.cpp, -DSYNTHLAB_BENCH): each module of the modular catalog (framework/modular) timed
; in cycles per 32-frame block on the chip, then the engine around each synth; printed as [MBENCH] lines on the console 6 s after the
; start (again at each 'b' sent). tools/module_bench.py reads them and writes framework/modular/module_costs.h (SynthLab Studio's
; cycles wallet). The app runs as usual otherwise; do not touch the board while the bench plays its notes.
[env:hwv2_bench]
extends = env:hwv2
build_src_filter =
    ${env:hwv2.build_src_filter}
    +<framework/modular/catalog.cpp>     ; the catalog's descriptions (a generated synth needs only modules.h)
    +<framework/modular/engine_adapter.cpp>   ; the engine's modules in the catalog ("RM ..."): measured too
build_flags =
    ${env:hwv2.build_flags}
    -DSYNTHLAB_BENCH

[env:hwv1_bench]
extends = env:hwv1
build_src_filter =
    ${env:hwv1.build_src_filter}
    +<framework/modular/catalog.cpp>
    +<framework/modular/engine_adapter.cpp>
build_flags =
    ${env:hwv1.build_flags}
    -DSYNTHLAB_BENCH

; The engine's modules ("RM ...", the Ritual Machine's, through framework/modular/engine_adapter) measured alone: every family linked in
; leaves too little internal RAM for SynthLab's own engine to start, so this build times them and nothing else. module_bench.py merges
; its log with hwv1_bench's: --from bench.txt bench_rm.txt. Then every engine type natively, with q15 ports and no adapter ([MBENCH]
; native lines, ADR-050 step 0): the float / q15 table per function.
[env:hwv1_bench_rm]
extends = env:hwv1_bench
build_flags =
    ${env:hwv1_bench.build_flags}
    -DSYNTHLAB_BENCH_RM
