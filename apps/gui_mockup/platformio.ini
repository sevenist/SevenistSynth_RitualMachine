; The smallest firmware that shows the node GUI's mock-ups (apps/ritual_machine/docs/GUI_NODES.md) on the second prototype (HWV2, 128 x 160 colour
; screen): no engine, no audio, no input task, no LEDs, no card. Only the panel driver, the colour canvas, u8g2 and src/main.cpp, so it compiles
; and flashes in a fraction of the synth's time. Build it from VS Code (the folder "gui_mockup" in the PlatformIO status bar), never a bare `pio`
; from a shell (framework/docs/BOARDS.md), and upload with PlatformIO's Upload button. The BOOT button changes the frame.
[platformio]
default_envs = hwv2
src_dir = ../..
libdeps_dir = ../../.pio/libdeps         ; one download of the libraries for every app of the repo

[app]
dir = apps/gui_mockup

[env:hwv2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200

; What is compiled: the panel, the canvas, this app. Nothing else of the library.
build_src_filter =
    -<*>
    +<framework/ui/canvas.c>
    +<framework/boards/hwv2/display_panel.cpp>
    +<${app.dir}/src/>

build_flags =
    -I src
    -I ../../framework
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src/clib"   ; the C header "u8g2.h"
    -DHWV2
    -DDISPLAY_HEIGHT=160
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Os

build_unflags =
    -std=gnu++11
    -std=gnu++2a

lib_deps =
    olikraus/U8g2
lib_ldf_mode = chain
