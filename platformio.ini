; PlatformIO project for the ESP32 firmware. It shares src/core, src/hal, src/engine and src/platform/engine
; with the desktop simulator (built with build.ps1); src/platform/esp32 is the hardware side.
; See DEVELOPING.md ("ESP32 firmware and performance work"). STATUS: runs on the first prototype (HWV1). Flags marked "dev only" must go before a release.

[env:waveshare_esp32s3_pico]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino

; PlatformIO has no board definition for the Waveshare ESP32-S3-Pico, so use the
; generic ESP32-S3 dev board and override what differs. Check flash/PSRAM against
; your exact module (assumed here: 16 MB flash, 2 MB quad PSRAM).
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio                 ; as SynthBox (same hardware): code runs from flash through the cache, 40 MHz would be slow
board_build.f_flash = 80000000L
monitor_speed = 115200

build_flags =
    -I src                       ; so sources can include "core/...", "hal/...", "engine/..."
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src/clib"   ; core/ includes the C header "u8g2.h"
    -DDEV_OUTPUT_GAIN_PCT=12      ; dev only: output level in percent of full scale, to protect headphones on the first prototype (100 or remove = full) 1 percent now because i'm working in the middle of the night, sorry K. :) !
    -DDEV_SPEAKER_DEFAULT=0      ; dev only: the built-in speaker starts off (GENERAL "Spk" still turns it on; remove = full)
    -DDEV_BOOT_DELAY_MS=3000     ; dev only: wait after Serial.begin so the monitor catches the boot log (remove for release)
    -DARDUINO_RUNNING_CORE=0     ; the UI loop on core 0: core 1 belongs to the audio task (default would put loop() on core 1 too)
    ;-DHWV1_TEST_TONE            ; dev only: output a 440 Hz sine instead of the engine (uncomment to test the DAC / amp path alone)
    -DENGINE_FX_MONO=1          ; delay and reverb compute one channel (about half the delay cost and a third off the reverb; loses their stereo width)
    -DENGINE_REVERB_HALF=1       ; the reverb tank runs at half the sample rate (about half the reverb cost and memory; loses some of the top octave of the reverb)
    -DENGINE_CMD_RING=128        ; command ring entries (270 bytes each): 512 would take 137 KB of the internal RAM
    -DDEV_SERIAL_CMD             ; dev only: text commands over the serial port (note on/off, chord K), see tools/serial_test.py
    -DHWV1_BENCH                 ; dev only: micro benchmark of the DSP inner loops at boot (cycles per iteration, RAM vs PSRAM)
    -DENGINE_PROFILE             ; dev only: per-module CPU cycles per block, printed once a second with HWV1_DEBUG_AUDIO (small cost)
    -DHWV1_DEBUG_AUDIO           ; once a second: audio render time per block vs the time available (remove when done)
    -DHWV1_DEBUG_UI              ; dev only: once a second while the controls are used, the slowest UI step and synth update (remove when done)
    ;-DHWV1_DEBUG_INPUT           ; log raw key events on the serial console (remove when done)
    -DFASTLED_RMT_MAX_CHANNELS=1 ; the key LEDs use one RMT channel (as SynthBox)
    -DHWV1                       ; hardware revision, selects the pin block in src/platform/esp32/board_pins.h
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1         ; USB-Serial/JTAG as the serial console
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17                 ; the engine is C++17 (no exceptions, no RTTI, no heap after init)
    -fno-exceptions
    -fno-rtti
    -O2
    -DENGINE_SR=44100            ; test: 44.1 kHz instead of the default 48000 (never go below 44100; see src/engine/dsp/config.h)
    ; -DENGINE_BLOCK=32   (default; see src/engine/dsp/config.h)

; The Arduino framework appends -Os (size) AFTER the -O2 of build_flags, so without this the whole engine was compiled for size: almost nothing
; is inlined (a reverb sample made dozens of real calls into flash) and loops are not unrolled. build_src_flags apply to the project sources only.
build_src_flags =
    -O2
    -fno-stack-protector         ; the framework turns it on; a canary check on every function with a local array costs cycles in the audio path

build_unflags =
    -std=gnu++11
    -std=gnu++2a

lib_deps =
    olikraus/U8g2
    adafruit/Adafruit TCA8418@^1.0.2     ; keyboard controller (HWV1)
    fastled/FastLED@3.10.6               ; the 36 SK6812 key LEDs (HWV1). Pinned: this version gives the first RMT channel DMA by itself on the S3
                                         ; (SynthBox patched 3.10.3 for that); without DMA an audio interrupt can stretch the signal and the LEDs flicker

; lib/ holds third-party code for the desktop build only (u8g2's SDL copy; the AMY copy is only needed to
; regenerate the DX7 tables with tools/gen_dx7.py). PlatformIO treats every folder in lib/ as a library, so ignore both.
lib_ignore =
    u8g2
    amy

