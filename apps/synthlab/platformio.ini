; PlatformIO project for SynthLab's firmware on the second prototype (HWV2, KiCad project GRV-mini: ESP32-S3, 128 x 160 colour screen).
; Build it from VS Code (open oled_sim.code-workspace, pick the folder "synthlab" in the PlatformIO status bar), or from the repo root
; with C:\.platformio\penv\Scripts\pio.exe run -d apps/synthlab, never a bare `pio` (framework/docs/BOARDS.md, the warning under "ESP32 firmware
; and performance work"); flash with -t upload. Only HWV2 has an environment: the app finds its controls in any board's table, so one for
; the first prototype would be apps/template's [env:hwv1] with this app's dir.
[platformio]
default_envs = hwv2
; The source folder is the repo root, and build_src_filter below picks the library's parts and this app out of it: both are then
; "project sources" to PlatformIO and get the same compiler flags (build_src_flags). As a PlatformIO library the engine would be
; compiled with the framework's -Os, which the audio code cannot afford (framework/docs/DESIGN.md ADR-035).
src_dir = ../..
libdeps_dir = ../../.pio/libdeps         ; one download of the libraries for every app of the repo

[app]
dir = apps/synthlab                      ; this folder, from the repo root

[env:hwv2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino

; The module is a Waveshare ESP32-S3-Pico (16 MB flash, 2 MB quad PSRAM): the generic S3 board with what differs.
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200

build_src_filter =
    +<framework/engine/>
    +<framework/ui/>             ; the drawing kit and its colour canvas
    +<framework/boards/esp32/>   ; what the ESP32 boards share: the display task, the LEDs, I2S, the mux, the input queue, the power
    +<framework/boards/hwv2/>    ; the second prototype: its screen, controls, LEDs, card, power switch
    +<${app.dir}/src/>

build_flags =
    -I src                       ; this app's headers
    -I ../../framework           ; the library: "engine/...", "hal/...", "ui/...", "boards/..."
    -I "$PROJECT_LIBDEPS_DIR/$PIOENV/U8g2/src/clib"   ; the C header "u8g2.h"
    -DHWV2                       ; hardware revision: the board of framework/boards/hwv2 (its pin block: boards/esp32/board_pins.h)
    -DDISPLAY_HEIGHT=160         ; its screen is 128 x 160
    -DDEV_OUTPUT_GAIN_PCT=25     ; output level in percent of full scale: protects headphones (100 or remove = full)
    -DFASTLED_RMT_MAX_CHANNELS=1 ; the LEDs use one RMT channel
    -DHW_LED_MAX_BRIGHTNESS=80   ; LED brightness cap 0..255
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1         ; USB-Serial/JTAG as the serial console
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0     ; loop() on core 0: core 1 belongs to the audio task
    -DENGINE_CMD_RING=64         ; command ring entries (270 bytes each, from the engine's bulk heap): a change of synth sends 17 at once
    -std=gnu++17                 ; the engine is C++17 (no exceptions, no RTTI, no heap after init)
    -fno-exceptions
    -fno-rtti
    -O2
    ; the sample rate is the engine's default, 48 kHz: 160000 cycles of the audio core per 32-frame block, for every voice together

; The Arduino framework appends -Os AFTER the -O2 of build_flags; build_src_flags come last and apply to the project sources
; (the engine and this app). Without them the audio code is compiled for size and hardly anything is inlined.
build_src_flags =
    -O2
    -fno-stack-protector

build_unflags =
    -std=gnu++11
    -std=gnu++2a

lib_deps =
    olikraus/U8g2                        ; the drawing (u8g2 draws into the colour frame: ui/canvas.h)
    fastled/FastLED@3.10.6               ; the LEDs (pinned: see apps/ritual_machine/platformio.ini)
