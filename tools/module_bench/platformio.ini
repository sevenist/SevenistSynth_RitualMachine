; The module bench (README.md): every engine module type alone, the board's own and SynthLab Studio's float ones, per 32-frame block.
;   qemu   Espressif's QEMU (machine esp32s3): module_bench.py --qemu builds the flash image and runs it with -icount (instructions,
;          the same count on every run). The console on UART0.
;   hwv2   the second prototype: CPU cycles; flash on COM12, the console on the native USB port (COM13).
; Build with C:\.platformio\penv\Scripts\pio.exe run -d tools/module_bench -e qemu (never a bare pio: framework/docs/BOARDS.md).
[platformio]
default_envs = qemu
src_dir = ../..                          ; the repo root: the engine and the catalog are project sources (the same -O2 as the apps)
libdeps_dir = ../../.pio/libdeps

[bench]
dir = tools/module_bench

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
build_src_filter =
    +<framework/engine/>
    +<framework/modular/catalog.cpp>
    +<framework/modular/engine_modules.cpp>
    +<${bench.dir}/src/>
; The engine as the Ritual Machine builds it (its rate, mono FX, the reverb at half rate), with SynthLab's -mtext-section-literals (code
; defined in a header in internal RAM: the catalog's modules)
build_flags =
    -I ../../framework
    -DENGINE_SR=44100
    -DENGINE_FX_MONO=1
    -DENGINE_REVERB_HALF=1
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -O2
build_src_flags =
    -O2
    -fno-stack-protector
    -mtext-section-literals
build_unflags =
    -std=gnu++11
    -std=gnu++2a

[env:hwv2]
platform = ${common.platform}
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
monitor_speed = 115200
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = ${common.build_src_flags}
build_unflags = ${common.build_unflags}

; QEMU: the same chip, the console on UART0 (QEMU has no USB console), 4 MB of flash (QEMU's image sizes: 2, 4, 8 or 16 MB)
[env:qemu]
platform = ${common.platform}
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -DMB_QEMU
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_src_flags = ${common.build_src_flags}
build_unflags = ${common.build_unflags}
